name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check custom_components tests
      - name: Tests
        shell: bash
        run: |
          set +e
          python -m pytest --tb=short 2>&1 | tee pytest-output.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            {
              echo "### Pytest failure"
              echo '```text'
              tail -n 120 pytest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            details="$(tail -n 80 pytest-output.log)"
            details="${details//'%'/'%25'}"
            details="${details//$'\n'/'%0A'}"
            details="${details//$'\r'/'%0D'}"
            echo "::error title=Pytest failures::$details"
          fi
          exit "$status"
